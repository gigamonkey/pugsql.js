name: Publish to npm

# Publishes via npm Trusted Publisher (OIDC) — no NPM_TOKEN secret. The
# Trusted Publisher binding on npmjs.com is configured against THIS file's
# name (publish.yml); keep the filename stable so the binding stays valid.
#
# Trigger: push of a `v*` tag, normally created by `make release`.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm test
      - run: npm publish --provenance --access public
